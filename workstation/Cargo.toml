[package]
name = "divine-workstation"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
wasm-bindgen = "=0.2.121"
console_error_panic_hook = "0.1.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "Location", "History"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[profile.dev]
debug = 0
