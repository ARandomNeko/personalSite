<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#eeeade" />
		<title>Rituparan Reddy / Personal Systems</title>
		<meta
			name="description"
			content="The personal workstation of Rituparan Reddy. Projects, literature, and notes. Built in Rust with GPUI and WebAssembly."
		/>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: #eeeade;
				color: #282b25;
			}
			#boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-content: center;
				gap: 24px;
				padding: 32px;
				font: 12px monospace;
				z-index: 2;
				background: #eeeade;
			}
			#boot h1 {
				font:
					italic 76px Georgia,
					serif;
				margin: 0;
				font-weight: normal;
			}
			#boot p {
				max-width: 48ch;
				line-height: 1.8;
			}
			#boot a {
				color: inherit;
				text-underline-offset: 4px;
			}
			#boot nav {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
			}
			[data-renderer='gpui'] #boot {
				display: none;
			}
			#accessible {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
			}
			#accessible:focus-within {
				z-index: 10;
				top: 0;
				left: 0;
				width: 100%;
				height: auto;
				padding: 16px;
				clip-path: none;
				background: #eeeade;
			}
		</style>
	</head>
	<body>
		<div id="boot" role="status" aria-live="polite">
			<h1>Rituparan Reddy.</h1>
			<p id="boot-message">Opening the workstation. A moment, please.</p>
			<nav aria-label="HTML editions">
				<a href="/projects" target="_top">Projects</a><a href="/reading" target="_top">Reading</a
				><a href="/blog" target="_top">Journal</a><a href="/resume" target="_top">Résumé</a>
			</nav>
		</div>
		<nav id="accessible" aria-label="Accessible HTML editions">
			<a href="/projects" target="_top">Read projects in HTML</a>
			<a href="/reading" target="_top">Read the reading list in HTML</a>
			<a href="/blog" target="_top">Read the journal in HTML</a>
			<a href="/resume" target="_top">Read the résumé in HTML</a>
		</nav>
		<script type="module">
			const message = document.querySelector('#boot-message');
			const fail = (error) => {
				console.error('Workstation startup failed:', error);
				message.textContent =
					'The workstation could not start. You can still read everything through the links below.';
			};
			window.addEventListener('error', (event) => fail(event.error));
			window.addEventListener('unhandledrejection', (event) => fail(event.reason));
			try {
				const {
					default: init,
					run,
					navigate,
					inspect_state
				} = await import('./pkg/divine_workstation.js');
				await init();
				run();
				window.workstation = { inspect: () => JSON.parse(inspect_state()) };
				window.addEventListener('popstate', () => navigate(window.location.hash));
				window.addEventListener('hashchange', () => navigate(window.location.hash));
				setTimeout(() => {
					if (document.documentElement.dataset.renderer !== 'gpui') {
						message.textContent =
							'Browser graphics did not start. You can read the HTML editions below.';
					}
				}, 20000);
			} catch (error) {
				fail(error);
			}
		</script>
	</body>
</html>
